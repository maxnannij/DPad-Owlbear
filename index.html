<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D-Pad para Owlbear</title>
<style>
  :root { color-scheme: dark; --bg:#151922; --panel:#202633; --button:#303b4d; --hover:#43536b; --accent:#8fb8ff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:12px; background:var(--bg); color:#f4f6fa; font:13px system-ui,-apple-system,Segoe UI,sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; text-align:center; }
  .sub { text-align:center; color:#b6c0d0; font-size:11px; margin-bottom:10px; }
  .pad { display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,52px); gap:6px; justify-content:center; }
  button { border:1px solid #4b5870; border-radius:12px; background:var(--button); color:white; font-size:22px; cursor:pointer; box-shadow:0 3px 0 #0b0e13; touch-action:manipulation; }
  button:hover { background:var(--hover); }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 #0b0e13; }
  .empty { visibility:hidden; }
  .center { font-size:16px; color:var(--accent); }
  #status { min-height:30px; margin-top:10px; padding:8px; border-radius:9px; background:var(--panel); color:#c7d0df; font-size:11px; text-align:center; }
  .dock { display:flex; gap:6px; margin-top:10px; }
  .dock button {
    flex:1; font-size:11px; padding:8px 6px; border-radius:9px;
    box-shadow:none; border:1px solid #4b5870;
  }
  .dock button.active { border-color:var(--accent); color:var(--accent); }
  .hint { color:#909caf; font-size:10px; text-align:center; margin-top:8px; line-height:1.35; }
</style>
</head>
<body>
  <h1>🕹️ D-Pad</h1>
  <div class="sub">150 px por pulsación</div>
  <div class="pad" aria-label="Control direccional">
    <div class="empty"></div><button data-dy="-1" aria-label="Arriba">▲</button><div class="empty"></div>
    <button data-dx="-1" aria-label="Izquierda">◀</button><button class="center" id="center" title="No mueve">●</button><button data-dx="1" aria-label="Derecha">▶</button>
    <div class="empty"></div><button data-dy="1" aria-label="Abajo">▼</button><div class="empty"></div>
  </div>
  <div id="status">Conectando con Owlbear Rodeo…</div>
  <div class="dock">
    <button type="button" id="side-left" title="Anclar abajo a la izquierda">◀ Izquierda</button>
    <button type="button" id="side-right" title="Anclar abajo a la derecha">Derecha ▶</button>
  </div>
  <div class="hint">Solo tokens con ownership.<br>Elegí el lado para la ventana flotante.</div>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@1";

const status = document.getElementById("status");
const DISTANCE = 150;
const POPOVER_ID = "com.maxnanni.dpad/float";
const URL = "https://maxnannij.github.io/DPad-Owlbear/index.html";
const WIDTH = 230;
const HEIGHT = 300;
let ready = false;

function getSide() {
  try {
    return localStorage.getItem("dpad-side") === "right" ? "right" : "left";
  } catch {
    return "left";
  }
}

function setSide(side) {
  try {
    localStorage.setItem("dpad-side", side);
  } catch (_) {}
  document.getElementById("side-left").classList.toggle("active", side === "left");
  document.getElementById("side-right").classList.toggle("active", side === "right");
}

function popoverOptions(side) {
  const isRight = side === "right";
  return {
    id: POPOVER_ID,
    url: URL,
    width: WIDTH,
    height: HEIGHT,
    anchorReference: "POSITION",
    anchorPosition: { left: isRight ? 10000 : 16, top: 10000 },
    anchorOrigin: {
      horizontal: isRight ? "RIGHT" : "LEFT",
      vertical: "BOTTOM",
    },
    transformOrigin: {
      horizontal: isRight ? "RIGHT" : "LEFT",
      vertical: "BOTTOM",
    },
    marginThreshold: 12,
    disableClickAway: true,
  };
}

async function dockTo(side) {
  setSide(side);
  try {
    await OBR.popover.close(POPOVER_ID);
  } catch (_) {}
  await OBR.popover.open(popoverOptions(side));
}

OBR.onReady(async () => {
  ready = true;
  setSide(getSide());
  await refreshStatus();
  OBR.player.onChange(() => refreshStatus());
});

async function canControlItem(item) {
  const role = await OBR.player.getRole();
  if (role === "GM") return true;
  return item.createdUserId === OBR.player.id;
}

async function refreshStatus() {
  try {
    const ids = await OBR.player.getSelection();
    if (!ids || ids.length === 0) {
      status.textContent = "Seleccioná tu personaje en el mapa";
      return;
    }
    const items = await OBR.scene.items.getItems(ids);
    let owned = 0;
    for (const item of items) {
      if (await canControlItem(item)) owned++;
    }
    if (owned === 0) {
      status.textContent = "Ningún token seleccionado es tuyo (ownership)";
    } else if (owned < items.length) {
      status.textContent = `${owned} de ${items.length} token(s) con ownership`;
    } else {
      status.textContent = `${owned} token(s) seleccionado(s)`;
    }
  } catch (e) {
    status.textContent = "No se pudo leer la selección. Abrí este panel desde Owlbear.";
  }
}

async function move(dx, dy) {
  if (!ready) return;
  try {
    const ids = await OBR.player.getSelection();
    if (!ids || ids.length === 0) {
      status.textContent = "Primero seleccioná un token en el mapa.";
      return;
    }

    const items = await OBR.scene.items.getItems(ids);
    const movableIds = [];
    for (const item of items) {
      if (item.locked) continue;
      if (await canControlItem(item)) movableIds.push(item.id);
    }

    if (movableIds.length === 0) {
      status.textContent = "No tenés ownership de los tokens seleccionados.";
      return;
    }

    await OBR.scene.items.updateItems(
      item => movableIds.includes(item.id),
      draft => {
        for (const item of draft) {
          item.position.x += dx * DISTANCE;
          item.position.y += dy * DISTANCE;
        }
      }
    );
    status.textContent = `Movido ${DISTANCE} px · ${movableIds.length} token(s)`;
  } catch (e) {
    console.error(e);
    status.textContent = "No se pudo mover. Verificá los permisos del token.";
  }
}

document.querySelectorAll("button[data-dx],button[data-dy]").forEach(button => {
  button.addEventListener("click", () => {
    move(Number(button.dataset.dx || 0), Number(button.dataset.dy || 0));
  });
});
document.getElementById("center").addEventListener("click", () => {
  status.textContent = "Seleccioná una flecha para mover el personaje.";
});
document.getElementById("side-left").addEventListener("click", () => dockTo("left"));
document.getElementById("side-right").addEventListener("click", () => dockTo("right"));
</script>
</body>
</html>
