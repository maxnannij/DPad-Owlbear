<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>D-Pad background</title>
</head>
<body>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@1";

const POPOVER_ID = "com.maxnanni.dpad/float";
const URL = "https://maxnannij.github.io/DPad-Owlbear/index.html";
const WIDTH = 230;
const HEIGHT = 300;

function sideFromStorage() {
  try {
    return localStorage.getItem("dpad-side") === "right" ? "right" : "left";
  } catch {
    return "left";
  }
}

function isCollapsed() {
  try {
    return localStorage.getItem("dpad-collapsed") === "1";
  } catch {
    return false;
  }
}

function popoverOptions(side) {
  const isRight = side === "right";
  return {
    id: POPOVER_ID,
    url: URL,
    width: WIDTH,
    height: HEIGHT,
    anchorReference: "POSITION",
    anchorPosition: { left: isRight ? 10000 : 16, top: 10000 },
    anchorOrigin: {
      horizontal: isRight ? "RIGHT" : "LEFT",
      vertical: "BOTTOM",
    },
    transformOrigin: {
      horizontal: isRight ? "RIGHT" : "LEFT",
      vertical: "BOTTOM",
    },
    marginThreshold: 12,
    disableClickAway: true,
  };
}

async function openFloat(side) {
  try {
    await OBR.popover.close(POPOVER_ID);
  } catch (_) {}
  await OBR.popover.open(popoverOptions(side || sideFromStorage()));
}

OBR.onReady(async () => {
  if (!isCollapsed()) {
    await openFloat();
  }

  // Si el usuario abre el action del D-Pad, ofrecemos reabrir el flotante
  OBR.action.onOpenChange(async (isOpen) => {
    if (!isOpen) return;
    try {
      localStorage.setItem("dpad-collapsed", "0");
    } catch (_) {}
  });
});
</script>
</body>
</html>
