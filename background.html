<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>D-Pad background</title>
</head>
<body>
<script type="module">
import OBR from "https://esm.sh/@owlbear-rodeo/sdk@1";

const POPOVER_ID = "com.maxnanni.dpad/float";
const URL = "https://maxnannij.github.io/DPad-Owlbear/index.html";
const FULL_W = 230;
const FULL_H = 300;
const MINI_W = 52;
const MINI_H = 52;

function sideFromStorage() {
  try {
    return localStorage.getItem("dpad-side") === "right" ? "right" : "left";
  } catch {
    return "left";
  }
}

function isMinimized() {
  try {
    return localStorage.getItem("dpad-minimized") === "1";
  } catch {
    return false;
  }
}

function popoverOptions(side, minimized) {
  const isRight = side === "right";
  return {
    id: POPOVER_ID,
    url: URL,
    width: minimized ? MINI_W : FULL_W,
    height: minimized ? MINI_H : FULL_H,
    anchorReference: "POSITION",
    anchorPosition: { left: isRight ? 10000 : 16, top: 10000 },
    anchorOrigin: {
      horizontal: isRight ? "RIGHT" : "LEFT",
      vertical: "BOTTOM",
    },
    transformOrigin: {
      horizontal: isRight ? "RIGHT" : "LEFT",
      vertical: "BOTTOM",
    },
    marginThreshold: 12,
    disableClickAway: true,
  };
}

OBR.onReady(async () => {
  const side = sideFromStorage();
  const minimized = isMinimized();
  try {
    await OBR.popover.close(POPOVER_ID);
  } catch (_) {}
  await OBR.popover.open(popoverOptions(side, minimized));
});
</script>
</body>
</html>
